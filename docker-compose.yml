services:
  apurador:
    build: .
    restart: unless-stopped
    ports:
      - "${APURADOR_PORT:-8000}:80"
    environment:
      TSE_ELECTION_YEAR: "${TSE_ELECTION_YEAR:-2026}"
      TSE_FEDERAL_FIRST_TURN_CODE: "${TSE_FEDERAL_FIRST_TURN_CODE:-6257}"
      TSE_FEDERAL_SECOND_TURN_CODE: "${TSE_FEDERAL_SECOND_TURN_CODE:-6258}"
      TSE_STATE_FIRST_TURN_CODE: "${TSE_STATE_FIRST_TURN_CODE:-6259}"
      TSE_STATE_SECOND_TURN_CODE: "${TSE_STATE_SECOND_TURN_CODE:-6260}"
